spring.application.name=animal-pictures
server.port=8080

# Embedded H2 database stored in a file, so pictures survive restarts.
# Relative to the working directory: ./data locally, /app/data in the container.
spring.datasource.url=jdbc:h2:file:./data/animal-pictures
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true

# API messages (e.g. validation errors) always in English, whatever the machine's language
spring.web.locale=en
spring.web.locale-resolver=fixed

# Picture sources. {width} and {height} are replaced with random sizes so every picture is different.
# placekitten.com is offline, so cats come from cataas.com (listed in public-apis/public-apis).
animal-pictures.sources.cat=https://cataas.com/cat?width={width}&height={height}
animal-pictures.sources.dog=https://place.dog/{width}/{height}
animal-pictures.sources.bear=https://placebear.com/{width}/{height}
animal-pictures.min-size=200
animal-pictures.max-size=500
animal-pictures.timeout=15s
