<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dog">
  <!-- head -->
  <ellipse cx="32" cy="35" rx="18" ry="18" fill="#ffffff" stroke="#3b3247" stroke-width="2.5"/>
  <!-- eye patch -->
  <ellipse cx="39.5" cy="30.5" rx="6.4" ry="6" fill="#f3c9ae"/>
  <!-- floppy ears -->
  <g stroke="#3b3247" stroke-width="2.5" stroke-linejoin="round" fill="#d99a75">
    <path d="M18 19 C8 18 5 33 8.5 42 C10.5 47.5 16.5 46 17.5 40.5 C18.5 34 19.5 25 18 19 Z"/>
    <path d="M46 19 C56 18 59 33 55.5 42 C53.5 47.5 47.5 46 46.5 40.5 C45.5 34 44.5 25 46 19 Z"/>
  </g>
  <!-- eyes -->
  <circle cx="25" cy="31" r="2.7" fill="#3b3247"/>
  <circle cx="39.5" cy="31" r="2.7" fill="#3b3247"/>
  <circle cx="25.9" cy="30.1" r="0.9" fill="#ffffff"/>
  <circle cx="40.4" cy="30.1" r="0.9" fill="#ffffff"/>
  <!-- cheeks -->
  <circle cx="20" cy="39" r="3" fill="#f6b8c8" opacity="0.75"/>
  <circle cx="44" cy="39" r="3" fill="#f6b8c8" opacity="0.75"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="42" rx="9" ry="7" fill="#fff5ee" stroke="#3b3247" stroke-width="2.5"/>
  <!-- tongue -->
  <path d="M29.6 45.4 H34.4 V48 A2.4 2.4 0 0 1 29.6 48 Z" fill="#f28b9b" stroke="#3b3247" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- nose and mouth -->
  <ellipse cx="32" cy="38.6" rx="3.6" ry="2.6" fill="#3b3247"/>
  <g stroke="#3b3247" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M32 41 V43.4"/>
    <path d="M32 43.4 Q29.2 46.4 26.4 44.2"/>
    <path d="M32 43.4 Q34.8 46.4 37.6 44.2"/>
  </g>
</svg>
